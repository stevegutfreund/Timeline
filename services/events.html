<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ציר הזמן</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f3f2ee;
    --surface: #ffffff;
    --surface-2: #f8f7f4;
    --surface-3: #efede7;
    --ink: #1b1a17;
    --ink-2: #47443d;
    --muted: #7a766c;
    --line: #e3e0d8;
    --line-strong: #cfcbc0;
    --accent: #3f3cbb;
    --accent-soft: #ecebfb;
    --accent-ink: #2e2b99;
    --gold: #b8892b;
    --birth: #13846f;
    --birth-soft: #e2f3ef;
    --death: #a8434f;
    --death-soft: #f7e7e9;
    --event: #b86e0b;
    --event-soft: #fbf0df;
    --life: #5a57c9;
    --life-bg: #e9e8fb;
    --life-ink: #2b2878;
    --shadow-sm: 0 1px 2px rgba(27, 26, 23, .06);
    --shadow: 0 1px 2px rgba(27, 26, 23, .05), 0 4px 14px rgba(27, 26, 23, .06);
    --shadow-lg: 0 10px 40px rgba(27, 26, 23, .18);
    --r: 12px;
    --r-sm: 8px;
    --font: 'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    --serif: 'Frank Ruhl Libre', 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121214;
      --surface: #1b1b1f;
      --surface-2: #202025;
      --surface-3: #2a2a30;
      --ink: #ecebe6;
      --ink-2: #c9c6bd;
      --muted: #8f8c84;
      --line: #2e2e35;
      --line-strong: #3d3d45;
      --accent: #8d8bf2;
      --accent-soft: #26254a;
      --accent-ink: #c4c3ff;
      --gold: #d8ad55;
      --birth: #3cc4a6;
      --birth-soft: #15302b;
      --death: #e07a86;
      --death-soft: #3a1f24;
      --event: #e6a245;
      --event-soft: #3a2b14;
      --life: #8d8bf2;
      --life-bg: #2a2950;
      --life-ink: #dcdbff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --shadow-lg: 0 10px 40px rgba(0,0,0,.55);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- App bar ---------- */
  .appbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), #6b47c9);
    color: #fff; font-size: 16px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .brand h1 { font-family: var(--serif); font-size: 20px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
  .brand p { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .seg {
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--surface-3); border-radius: 10px;
  }
  .seg button {
    padding: 6px 14px; border-radius: 7px; font-weight: 500; font-size: 13px;
    color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .seg button i { font-size: 12px; opacity: .8; }

  .appbar .spacer { flex: 1; }
  .stats { display: flex; gap: 18px; color: var(--muted); font-size: 12px; }
  .stats b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.2; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 36px; padding: 0 14px; border-radius: 9px;
    font-weight: 500; font-size: 13px; white-space: nowrap;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
  .btn:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  @media (prefers-color-scheme: dark) { .btn-primary { color: #15142e; } .btn-primary:hover { background: #a9a7ff; } }
  .btn:disabled { opacity: .6; cursor: default; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; display: inline-grid; place-items: center;
    color: var(--ink-2); border: 1px solid var(--line); background: var(--surface);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }

  /* ---------- Views ---------- */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  /* ---------- Timeline toolbar ---------- */
  .tl-toolbar {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px 10px;
  }
  .eras-nav {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0;
    mask-image: linear-gradient(to left, #000 92%, transparent);
  }
  .eras-nav::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .chip .ct { color: var(--muted); font-weight: 400; }
  .chip.active .ct { color: inherit; opacity: .7; }

  .tool-group { display: flex; align-items: center; gap: 4px; flex: none; }
  .tool-group .divider { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  .year-jump { position: relative; }
  .year-jump input {
    width: 112px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); padding: 0 32px 0 10px; font-size: 13px; direction: ltr; text-align: right;
  }
  .year-jump input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .year-jump i { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }

  /* ---------- Timeline card ---------- */
  .tl-card {
    flex: 1; min-height: 0; margin: 0 20px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  }
  .stage {
    flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column;
    overflow: hidden; direction: ltr; touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  .stage.dragging { cursor: grabbing; }
  .grid { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .grid .band { position: absolute; top: 0; bottom: 0; }
  .grid .gl { position: absolute; top: 30px; bottom: 0; width: 1px; background: var(--line); opacity: .65; }
  .grid .flash { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); box-shadow: 0 0 0 4px rgba(184,137,43,.18); animation: flash 2.2s ease forwards; }
  @keyframes flash { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

  .era-strip { flex: none; height: 30px; position: relative; z-index: 1; border-bottom: 1px solid var(--line); overflow: hidden; }
  .era-seg {
    position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 13px; font-weight: 500; color: var(--ink-2);
    border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; direction: rtl;
    cursor: pointer;
  }
  .era-seg:hover { color: var(--ink); }
  .era-seg span { position: absolute; padding: 0 8px; }

  .lane { position: relative; z-index: 1; }
  .lane-tag {
    position: absolute; top: 8px; right: 10px; z-index: 3; direction: rtl;
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--muted);
    background: var(--surface); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
    pointer-events: none;
  }
  .lane-events { flex: 0 0 44%; }
  .lane-lives { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .lives-inner { position: relative; }

  .axis {
    flex: none; height: 34px; position: relative; z-index: 2;
    border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .tick { position: absolute; top: 0; height: 6px; width: 1px; background: var(--line-strong); }
  .tick.minor { height: 4px; opacity: .7; }
  .tick-label { position: absolute; top: 9px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* event cards */
  .stem { position: absolute; bottom: 0; width: 1px; background: var(--line-strong); }
  .ev-card {
    position: absolute; height: 28px; display: flex; align-items: center; gap: 7px;
    padding: 0 10px 0 9px; direction: rtl; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-right: 3px solid var(--c, var(--event));
    border-radius: 7px 3px 3px 7px; box-shadow: var(--shadow-sm);
    font-size: 12.5px; white-space: nowrap; transition: box-shadow .15s, border-color .15s, transform .15s;
  }
  .ev-card:hover { box-shadow: var(--shadow); border-color: var(--line-strong); border-right-color: var(--c, var(--event)); z-index: 5; }
  .ev-card.sel { box-shadow: 0 0 0 2px var(--accent); z-index: 6; }
  .ev-card .yr { font-weight: 600; color: var(--c, var(--event)); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .ev-card .tx { overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .ev-dot {
    position: absolute; bottom: 4px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%;
    background: var(--c, var(--event)); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--c, var(--event));
    cursor: pointer;
  }
  .ev-dot:hover { transform: scale(1.35); }

  /* lifespans */
  .life {
    position: absolute; height: 22px; border-radius: 6px; cursor: pointer;
    background: var(--life-bg); border: 1px solid color-mix(in srgb, var(--life) 35%, transparent);
    transition: box-shadow .15s, background .15s;
  }
  .life::before, .life::after { content: ''; position: absolute; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; }
  .life::before { right: 2px; background: var(--birth); }
  .life::after { left: 2px; background: var(--death); }
  .life.open { border-left-style: dashed; background: linear-gradient(to left, transparent, var(--life-bg) 60%); }
  .life.open::after { display: none; }
  .life:hover { background: color-mix(in srgb, var(--life) 22%, var(--surface)); }
  .life.sel { box-shadow: 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--life) 28%, var(--surface)); z-index: 4; }
  .life-label {
    position: absolute; height: 22px; display: flex; align-items: center; gap: 6px;
    direction: rtl; font-size: 12px; font-weight: 500; color: var(--life-ink); white-space: nowrap; cursor: pointer;
  }
  .life-label { z-index: 5; }
  .life-label.out:hover { color: var(--life-ink); }
  .life-label small { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .life-label.out { color: var(--ink-2); }

  .crosshair { position: absolute; top: 30px; bottom: 0; width: 1px; background: var(--accent); opacity: .55; z-index: 3; pointer-events: none; display: none; }
  .cross-label {
    position: absolute; z-index: 4; transform: translate(-50%, -50%); pointer-events: none; display: none;
    background: var(--ink); color: var(--surface); font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    white-space: nowrap; font-variant-numeric: tabular-nums; direction: rtl;
  }

  .tl-hint {
    position: absolute; left: 12px; bottom: 10px; z-index: 3; direction: rtl;
    font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 999px; pointer-events: none;
  }

  /* minimap */
  .minimap {
    flex: none; height: 50px; position: relative; direction: ltr; border-top: 1px solid var(--line);
    background: var(--surface-2); cursor: pointer; touch-action: none; user-select: none; overflow: hidden;
  }
  .mm-band { position: absolute; top: 0; bottom: 0; opacity: .55; }
  .mm-tick { position: absolute; top: 12px; width: 2px; height: 16px; border-radius: 1px; opacity: .75; }
  .mm-lab { position: absolute; bottom: 3px; font-size: 10px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mm-window {
    position: absolute; top: 3px; bottom: 3px; border-radius: 6px; cursor: grab;
    border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent);
    box-shadow: 0 0 0 9999px color-mix(in srgb, var(--surface-2) 35%, transparent);
  }

  .tooltip {
    position: fixed; z-index: 50; pointer-events: none; display: none; max-width: 280px;
    background: var(--ink); color: var(--surface); padding: 8px 11px; border-radius: 8px;
    font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow-lg); direction: rtl;
  }
  .tooltip b { font-weight: 600; }
  .tooltip .tm { opacity: .7; font-size: 11.5px; }

  /* ---------- List view ---------- */
  .list-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px 1fr; gap: 0; }
  .filters {
    border-left: 1px solid var(--line); background: var(--surface); padding: 18px 18px 24px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  .field label, .field .lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .field .hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .input {
    width: 100%; height: 38px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); font-size: 13.5px;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea.input { height: auto; padding: 9px 12px; resize: vertical; min-height: 84px; line-height: 1.5; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input-icon { position: relative; }
  .input-icon i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  .input-icon .input { padding-right: 34px; }
  .kbd { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; line-height: 18px; background: var(--surface-2); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair .input { direction: ltr; text-align: right; }
  .type-filter { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .type-filter button {
    height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  }
  .type-filter button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .type-filter .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .filters details summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
  .filters details summary::-webkit-details-marker { display: none; }
  .filters details summary i { font-size: 10px; transition: transform .15s; }
  .filters details[open] summary i { transform: rotate(-90deg); }
  .filters details .field { margin-top: 10px; }

  .list-pane { min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .list-head {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .list-head .count { font-size: 13px; color: var(--muted); }
  .list-head .count b { color: var(--ink); font-size: 15px; font-weight: 600; }
  .list-body { padding: 8px 28px 60px; max-width: 980px; }

  .era-group { margin-top: 22px; }
  .era-head {
    display: flex; align-items: baseline; gap: 12px; padding: 6px 0 10px;
    border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  .era-head h3 { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .era-head .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .era-head .sw { width: 10px; height: 10px; border-radius: 3px; align-self: center; }

  .rows { position: relative; }
  .row {
    width: 100%; text-align: right; display: grid; grid-template-columns: 74px 28px 1fr; align-items: start; gap: 10px;
    padding: 10px 10px; border-radius: 10px; transition: background .12s;
  }
  .row:hover { background: var(--surface); box-shadow: var(--shadow-sm); }
  .row.sel { background: var(--accent-soft); }
  .row-year { text-align: left; direction: ltr; padding-top: 1px; }
  .row-year b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row-year span { display: block; font-size: 11.5px; color: var(--muted); direction: rtl; text-align: left; }
  .row-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; background: var(--s); color: var(--c); }
  .row-text { font-size: 14.5px; font-weight: 500; color: var(--ink); padding-top: 3px; }
  mark { background: color-mix(in srgb, var(--gold) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .row-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); background: var(--surface-3); border-radius: 6px; padding: 1px 8px; max-width: 100%; }
  .tag i { font-size: 10px; color: var(--muted); }
  .row > div:last-child { min-width: 0; }
  .tag.trunc { max-width: min(340px, 100%); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
  .gap-note { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11.5px; padding: 2px 0 2px 0; margin-right: 96px; }
  .gap-note::before { content: ''; width: 1px; height: 16px; border-right: 1.5px dashed var(--line-strong); margin-right: -14px; margin-left: 8px; }

  .empty { text-align: center; color: var(--muted); padding: 80px 20px; }
  .empty i { font-size: 28px; display: block; margin-bottom: 10px; opacity: .5; }

  /* ---------- Drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15, 14, 12, .28); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(440px, 100vw); z-index: 31;
    background: var(--surface); box-shadow: var(--shadow-lg); border-right: 1px solid var(--line);
    transform: translateX(-105%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .drawer-head .grow { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--s, var(--surface-3)); color: var(--c, var(--ink-2)); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; }
  .d-title { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
  .d-year { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; color: var(--muted); }
  .d-year b { font-size: 18px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .d-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .d-stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .d-stat .k { font-size: 11px; color: var(--muted); }
  .d-stat .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .d-stat .v small { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-right: 4px; }
  .d-sec { margin-top: 24px; }
  .d-sec h4 { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .d-sec h4 .n { font-weight: 500; letter-spacing: 0; background: var(--surface-3); border-radius: 999px; padding: 0 7px; }
  .refs { display: flex; flex-direction: column; gap: 6px; }
  .ref { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; font-size: 13px; color: var(--ink-2); }
  .ref i { color: var(--gold); margin-top: 4px; font-size: 11px; }
  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .person-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
  .person-chip:hover { border-color: var(--life); color: var(--life-ink); }
  .person-chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .mini-list { display: flex; flex-direction: column; }
  .mini { display: grid; grid-template-columns: 52px 10px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; text-align: right; width: 100%; font-size: 13px; }
  .mini:hover { background: var(--surface-2); }
  .mini.cur { background: var(--accent-soft); }
  .mini .y { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); text-align: left; direction: ltr; }
  .mini .d { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .mini .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .r { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lifebar { position: relative; height: 34px; margin-top: 16px; }
  .lifebar .track { position: absolute; top: 12px; left: 0; right: 0; height: 10px; border-radius: 5px; background: var(--life-bg); }
  .lifebar .mk { position: absolute; top: 9px; width: 4px; height: 16px; border-radius: 2px; margin-left: -2px; background: var(--c); }
  .lifebar .end { position: absolute; top: 26px; font-size: 10.5px; color: var(--muted); }
  .drawer-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; }

  /* ---------- Modal ---------- */
  .modal-wrap { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 14, 12, .38); }
  .modal-wrap.show { display: flex; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } }
  .modal { width: min(520px, 100%); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .18s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
  .modal-head { padding: 18px 22px 4px; display: flex; align-items: flex-start; justify-content: space-between; }
  .modal-head h2 { font-family: var(--serif); font-size: 21px; }
  .modal-head p { color: var(--muted); font-size: 12.5px; }
  .modal-body { padding: 14px 22px 4px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot { padding: 16px 22px 20px; display: flex; gap: 8px; justify-content: flex-start; }
  .preview { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 9px; padding: 9px 12px; min-height: 40px; }
  .preview b { color: var(--ink); font-weight: 600; }
  .req { color: var(--death); }

  /* ---------- Toast ---------- */
  .toasts { position: fixed; bottom: 22px; right: 50%; transform: translateX(50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 9px; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500; animation: toastIn .22s ease; }
  .toast.err i { color: #ff8a95; }
  .toast.ok i { color: #6fe0c4; }
  @keyframes toastIn { from { transform: translateY(10px); opacity: 0; } }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 10; background: var(--surface); }

  /* ---------- Responsive ---------- */
  @media (max-width: 980px) {
    .stats { display: none; }
  }
  @media (max-width: 760px) {
    .appbar { flex-wrap: wrap; padding: 10px 14px; gap: 10px; padding-top: max(10px, env(safe-area-inset-top)); }
    .brand p { display: none; }
    .brand h1 { font-size: 18px; }
    .brand-mark { width: 32px; height: 32px; }
    .appbar .seg { order: 5; width: 100%; }
    .appbar .seg button { flex: 1; justify-content: center; }
    .btn-add span { display: none; }
    .btn-add { width: 36px; padding: 0; }
    .tl-toolbar { flex-wrap: wrap; padding: 10px 14px 8px; gap: 8px; }
    .eras-nav { order: 2; flex-basis: 100%; }
    .tool-group { width: 100%; justify-content: space-between; }
    .year-jump input { width: 100px; }
    .tl-card { margin: 0 10px 10px; }
    .lane-events { flex-basis: 40%; }
    .tl-hint { display: none; }
    .list-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .filters { border-left: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; gap: 10px; max-height: 44vh; }
    .filters .hide-sm { display: none; }
    .filters .field .lbl, .filters .field > label[for="q"] { display: none; }
    .type-filter { grid-template-columns: repeat(4, 1fr); }
    .type-filter button { justify-content: center; padding: 0 4px; }
    .filters #clearFilters { height: 32px; }
    .list-head { padding: 10px 14px; }
    .list-body { padding: 4px 10px 40px; }
    .row { grid-template-columns: 56px 26px 1fr; gap: 8px; padding: 9px 6px; }
    .gap-note { margin-right: 74px; }
    .drawer { top: auto; left: 0; right: 0; width: 100%; height: 82dvh; border-radius: 18px 18px 0 0; transform: translateY(105%); border-right: 0; }
    .drawer.show { transform: none; }
    .d-title { font-size: 22px; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark"><i class="fas fa-hourglass-half"></i></div>
      <div>
        <h1>ציר הזמן</h1>
        <p>כרונולוגיה מבריאת העולם · לפי סדר עולם</p>
      </div>
    </div>
    <nav class="seg" role="tablist" aria-label="תצוגה">
      <button role="tab" data-view="timeline" class="active"><i class="fas fa-timeline"></i>ציר זמן</button>
      <button role="tab" data-view="list"><i class="fas fa-list-ul"></i>רשימה וחיפוש</button>
    </nav>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
    <button class="btn btn-primary btn-add" id="addBtn" title="אירוע חדש"><i class="fas fa-plus"></i><span>אירוע חדש</span></button>
  </header>

  <main>
    <!-- ================= TIMELINE VIEW ================= -->
    <section class="view active" id="view-timeline">
      <div class="tl-toolbar">
        <div class="eras-nav" id="erasNav"></div>
        <div class="tool-group">
          <div class="year-jump">
            <i class="fas fa-location-crosshairs"></i>
            <input id="yearJump" type="number" inputmode="numeric" placeholder="שנה…" title="קפיצה לשנה (Enter)" aria-label="קפיצה לשנה" />
          </div>
          <span class="divider"></span>
          <button class="icon-btn" id="zoomOut" title="התרחק (−)"><i class="fas fa-minus"></i></button>
          <button class="icon-btn" id="zoomIn" title="התקרב (+)"><i class="fas fa-plus"></i></button>
          <button class="icon-btn" id="zoomFit" title="הצג הכל (0)"><i class="fas fa-expand"></i></button>
        </div>
      </div>
      <div class="tl-card">
        <div class="stage" id="stage">
          <div class="grid" id="grid"></div>
          <div class="era-strip" id="eraStrip"></div>
          <div class="lane lane-events" id="laneEvents"><span class="lane-tag">אירועים</span><div id="evLayer"></div></div>
          <div class="axis" id="axis"></div>
          <div class="lane lane-lives" id="laneLives"><span class="lane-tag" style="position:sticky;float:right;margin:8px 10px 0 0;top:8px">דמויות ושנות חיים</span><div class="lives-inner" id="livesLayer"></div></div>
          <div class="crosshair" id="cross"></div>
          <div class="cross-label" id="crossLabel"></div>
          <div class="tl-hint"><i class="fas fa-computer-mouse"></i> גלגלת לזום · גרירה להזזה · לחיצה לפרטים</div>
          <div class="loading" id="loading"><span><i class="fas fa-circle-notch fa-spin"></i> טוען אירועים…</span></div>
        </div>
        <div class="minimap" id="minimap"></div>
      </div>
    </section>

    <!-- ================= LIST VIEW ================= -->
    <section class="view" id="view-list">
      <div class="list-layout">
        <aside class="filters">
          <div class="field">
            <label for="q">חיפוש</label>
            <div class="input-icon">
              <i class="fas fa-magnifying-glass"></i>
              <input class="input" id="q" type="search" placeholder="אירוע, דמות או מקור…" autocomplete="off" />
              <span class="kbd hide-sm">/</span>
            </div>
          </div>
          <div class="field">
            <span class="lbl">סוג</span>
            <div class="type-filter" id="typeFilter">
              <button data-t="all" class="active"><span class="sw" style="background:var(--ink-2)"></span>הכל</button>
              <button data-t="event"><span class="sw" style="background:var(--event)"></span>אירועים</button>
              <button data-t="birth"><span class="sw" style="background:var(--birth)"></span>לידות</button>
              <button data-t="death"><span class="sw" style="background:var(--death)"></span>פטירות</button>
            </div>
          </div>
          <div class="field hide-sm">
            <label for="eraSel">תקופה</label>
            <select class="input" id="eraSel"><option value="">כל התקופות</option></select>
          </div>
          <div class="field hide-sm">
            <span class="lbl">טווח שנים</span>
            <div class="pair">
              <input class="input" id="fromY" type="number" inputmode="numeric" placeholder="משנה" />
              <input class="input" id="toY" type="number" inputmode="numeric" placeholder="עד שנה" />
            </div>
          </div>
          <details class="hide-sm">
            <summary><i class="fas fa-chevron-left"></i> טווח לפי אירועים</summary>
            <div class="field">
              <input class="input" id="fromText" placeholder="מאירוע… (למשל: לידת אברהם)" />
            </div>
            <div class="field">
              <input class="input" id="toText" placeholder="עד אירוע… (למשל: יציאת מצרים)" />
              <div class="hint" id="rangeHint"></div>
            </div>
          </details>
          <button class="btn" id="clearFilters"><i class="fas fa-rotate-left"></i> איפוס מסננים</button>
        </aside>
        <div class="list-pane" id="listPane">
          <div class="list-head">
            <div class="count" id="listCount"></div>
            <button class="btn" id="showOnTl"><i class="fas fa-timeline"></i> הצג טווח בציר</button>
          </div>
          <div class="list-body" id="listBody"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="grow" id="dPills"></div>
      <button class="icon-btn" id="dPrev" title="הקודם"><i class="fas fa-chevron-right"></i></button>
      <button class="icon-btn" id="dNext" title="הבא"><i class="fas fa-chevron-left"></i></button>
      <button class="icon-btn" id="dClose" title="סגירה (Esc)"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="dBody"></div>
    <div class="drawer-foot">
      <button class="btn btn-primary" id="dLocate"><i class="fas fa-location-crosshairs"></i> הצג בציר הזמן</button>
    </div>
  </aside>

  <!-- Add modal -->
  <div class="modal-wrap" id="modal">
    <form class="modal" id="addForm" autocomplete="off">
      <div class="modal-head">
        <div>
          <h2>אירוע חדש</h2>
          <p>השנה לפי מניין לבריאת העולם</p>
        </div>
        <button type="button" class="icon-btn" data-close><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="fYear">שנה <span class="req">*</span></label>
          <input class="input num" id="fYear" type="number" inputmode="numeric" min="0" max="10000" required style="direction:ltr;text-align:right" />
        </div>
        <div class="field">
          <label for="fText">תיאור האירוע <span class="req">*</span></label>
          <textarea class="input" id="fText" maxlength="500" required placeholder="למשל: מתן תורה"></textarea>
        </div>
        <div class="field">
          <label for="fRefs">מקורות</label>
          <input class="input" id="fRefs" placeholder="שמות יט א, שמות כ א" />
          <div class="hint">הפרדה בפסיקים</div>
        </div>
        <div class="preview" id="fPreview">הזינו שנה כדי לראות את מיקום האירוע בציר.</div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary" id="fSave"><i class="fas fa-check"></i> שמירה</button>
        <button type="button" class="btn" data-close>ביטול</button>
      </div>
    </form>
  </div>

  <div class="tooltip" id="tip"></div>
  <div class="toasts" id="toasts"></div>

<script>
  const APP_PREFIX = /^\/timeline(\/|$)/.test(location.pathname) ? '/timeline' : '';
  const API_BASE = location.origin + APP_PREFIX;
  const TOKEN = '__API_TOKEN__'; // filled in by the server from .env (routes/index.js)

  // ---------------- Eras (Seder Olam, years from Creation) ----------------
  const ERAS = [
    { id: 'creation', name: 'מבריאה עד המבול', from: 0,    to: 1656, color: '#8b7fd6' },
    { id: 'noah',     name: 'מהמבול עד אברהם', from: 1656, to: 1948, color: '#4f9bd1' },
    { id: 'avot',     name: 'תקופת האבות',     from: 1948, to: 2238, color: '#d39a3a' },
    { id: 'egypt',    name: 'שעבוד מצרים',     from: 2238, to: 2448, color: '#c76a5a' },
    { id: 'midbar',   name: 'דור המדבר',       from: 2448, to: 2488, color: '#b79a5d' },
    { id: 'joshua',   name: 'כיבוש והתנחלות',  from: 2488, to: 2516, color: '#5aa27c' },
    { id: 'judges',   name: 'תקופת השופטים',   from: 2516, to: 2882, color: '#7b8c9c' },
    { id: 'kings',    name: 'ימי המלוכה',      from: 2882, to: 2928, color: '#a2689e' },
  ];
  const TYPE = {
    event: { label: 'אירוע', icon: 'fa-star',        c: 'var(--event)', s: 'var(--event-soft)' },
    birth: { label: 'לידה',  icon: 'fa-seedling',    c: 'var(--birth)', s: 'var(--birth-soft)' },
    death: { label: 'פטירה', icon: 'fa-feather',     c: 'var(--death)', s: 'var(--death-soft)' },
    person:{ label: 'דמות',  icon: 'fa-user',        c: 'var(--life)',  s: 'var(--life-bg)' },
  };

  // ---------------- Helpers ----------------
  const $ = (s, el = document) => el.querySelector(s);
  const _ta = document.createElement('textarea');
  const decode = s => { _ta.innerHTML = s == null ? '' : String(s); return _ta.value; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const plural = (n, one, many) => n === 1 ? one : `${n} ${many}`;
  const yearsTxt = n => n === 0 ? 'באותה שנה' : n === 1 ? 'שנה אחת' : n === 2 ? 'שנתיים' : `${n} שנים`;

  function heYear(n) {
    if (!n || n < 1) return '';
    const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
    const tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
    const hund = ['', 'ק', 'ר', 'ש', 'ת', 'תק', 'תר', 'תש', 'תת', 'תתק'];
    const th = Math.floor(n / 1000);
    let r = n % 1000;
    let s = hund[Math.floor(r / 100)]; r %= 100;
    if (r === 15) s += 'טו'; else if (r === 16) s += 'טז'; else s += tens[Math.floor(r / 10)] + ones[r % 10];
    const pre = th ? ones[th] + '׳' : '';
    if (!s) return pre;
    return pre + (s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1));
  }
  const eraOf = y => { let e = ERAS[0]; for (const x of ERAS) if (y >= x.from) e = x; return e; };

  function toast(msg, kind = 'ok') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.innerHTML = `<i class="fas ${kind === 'err' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i>${esc(msg)}`;
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2800);
  }

  // ---------------- Data ----------------
  let EVENTS = [], BY_ID = new Map(), PEOPLE = [], PERSON_BY_ID = new Map(), POINTS = [];
  let DMIN = 0, DMAX = 2928;

  async function loadData() {
    const res = await fetch(`${API_BASE}/events`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data || []).filter(e => e.year !== null && e.year !== undefined && e.year !== '');
    EVENTS = raw.map(e => {
      const text = decode(e.text);
      const type = e.eventType || (/^לידת\s/.test(text) ? 'birth' : /^(פטירת|מות)\s/.test(text) ? 'death' : 'event');
      return { id: e.uuid, year: +e.year, text, refs: (e.references || []).map(decode).filter(Boolean), type, member: e.memberUuid || null };
    }).sort((a, b) => a.year - b.year || (a.type === 'birth' ? -1 : 0) - (b.type === 'birth' ? -1 : 0));
    BY_ID = new Map(EVENTS.map(e => [e.id, e]));

    const map = new Map();
    for (const e of EVENTS) {
      if (!e.member) continue;
      const p = map.get(e.member) || { id: e.member, name: '', birth: null, death: null };
      if (e.type === 'birth') p.birth = e;
      else if (e.type === 'death') p.death = e;
      if (!p.name || e.type === 'birth') p.name = e.text.replace(/^(לידת|פטירת|מות)\s+/, '');
      map.set(e.member, p);
      e.person = p;
    }
    PEOPLE = [...map.values()].map(p => ({
      ...p,
      start: p.birth ? p.birth.year : p.death.year,
      end: p.death ? p.death.year : null,
    })).sort((a, b) => a.start - b.start || (b.end ?? 1e9) - (a.end ?? 1e9));
    PERSON_BY_ID = new Map(PEOPLE.map(p => [p.id, p]));
    for (const e of EVENTS) if (e.person) e.person = PERSON_BY_ID.get(e.person.id);
    POINTS = EVENTS.filter(e => !e.member);

    const ys = EVENTS.map(e => e.year);
    DMIN = Math.min(0, ...ys);
    DMAX = Math.max(ERAS[ERAS.length - 1].to, ...ys);
    ERAS[ERAS.length - 1].to = DMAX;
  }
  // No recorded death (e.g. Chava, Kayin): don't claim they lived forever — assume at most 120 years.
  const OPEN_LIFE = 120;
  const alive = y => PEOPLE.filter(p => p.birth && p.birth.year <= y && (p.end != null ? p.end >= y : y - p.birth.year <= OPEN_LIFE));
  const lifespan = p => p.birth && p.death ? p.death.year - p.birth.year : null;

  function renderStats() {
    const span = DMAX - DMIN;
    const lives = PEOPLE.filter(p => p.birth && p.death).length;
    $('#stats').innerHTML = `
      <div><b class="num">${EVENTS.length}</b>אירועים</div>
      <div><b class="num">${PEOPLE.length}</b>דמויות</div>
      <div><b class="num">${lives}</b>שנות חיים מלאות</div>
      <div><b class="num">${EVENTS.length ? EVENTS[EVENTS.length - 1].year : 0}</b>שנים מתועדות</div>`;
  }

  // ================= TIMELINE =================
  const stage = $('#stage'), grid = $('#grid'), eraStrip = $('#eraStrip'), laneEvents = $('#laneEvents'),
        evLayer = $('#evLayer'), axis = $('#axis'), laneLives = $('#laneLives'), livesLayer = $('#livesLayer'),
        minimap = $('#minimap'), cross = $('#cross'), crossLabel = $('#crossLabel'), tip = $('#tip');
  const view = { c: 1464, ppy: 0.4 };
  let W = 1000, selected = null, flashYear = null, anim = 0;

  const ctx = document.createElement('canvas').getContext('2d');
  function textW(t, font) { ctx.font = font; return ctx.measureText(t).width; }

  // RTL time: earlier years on the right.
  const X = y => W / 2 - (y - view.c) * view.ppy;
  const Yat = x => view.c - (x - W / 2) / view.ppy;
  const fitPpy = () => (W - 80) / Math.max(1, DMAX - DMIN);
  const maxPpy = () => 60;

  function clampView() {
    view.ppy = clamp(view.ppy, fitPpy() * 0.85, maxPpy());
    const half = (W / 2) / view.ppy;
    const lo = DMIN + Math.min(half, (DMAX - DMIN) / 2) - 40 / view.ppy;
    const hi = DMAX - Math.min(half, (DMAX - DMIN) / 2) + 40 / view.ppy;
    view.c = lo > hi ? (DMIN + DMAX) / 2 : clamp(view.c, lo, hi);
  }

  function niceStep(minPx) {
    const raw = minPx / view.ppy;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 5, 10]) if (m * mag >= raw) return Math.max(1, m * mag);
    return 10 * mag;
  }

  function render() {
    W = stage.clientWidth;
    if (!W || !EVENTS.length) return;
    clampView();
    const yR = Yat(W), yL = Yat(0); // right edge = earliest visible year, left edge = latest

    // grid: era tint + gridlines
    const step = niceStep(W < 600 ? 70 : 90);
    const minor = step >= 5 ? step / 5 : 0;
    let g = '';
    ERAS.forEach((e, i) => {
      const l = X(e.to), r = X(e.from);
      if (r < 0 || l > W) return;
      g += `<div class="band" style="left:${l}px;width:${r - l}px;background:${e.color};opacity:${i % 2 ? .05 : .025}"></div>`;
    });
    let ax = '';
    const first = Math.ceil(Math.max(DMIN, yR - 5) / step) * step;
    for (let y = first; y <= Math.min(DMAX, yL + step); y += step) {
      const x = X(y);
      g += `<div class="gl" style="left:${x}px"></div>`;
      ax += `<div class="tick" style="left:${x}px"></div><div class="tick-label" style="left:${x}px">${y}</div>`;
    }
    if (minor) {
      for (let y = Math.ceil(Math.max(DMIN, yR) / minor) * minor; y <= Math.min(DMAX, yL); y += minor) {
        if (y % step) ax += `<div class="tick minor" style="left:${X(y)}px"></div>`;
      }
    }
    if (flashYear != null) g += `<div class="flash" style="left:${X(flashYear) - 1}px"></div>`;
    grid.innerHTML = g;
    axis.innerHTML = ax;

    // era strip
    eraStrip.innerHTML = ERAS.map(e => {
      const l = X(e.to), r = X(e.from), w = r - l;
      if (r < 0 || l > W) return '';
      const visL = Math.max(0, l), visR = Math.min(W, r), mid = (visL + visR) / 2 - l;
      const name = w > textW(e.name, '500 13px "Frank Ruhl Libre"') + 20 ? e.name : (w > 40 ? '…' : '');
      return `<div class="era-seg" data-era="${e.id}" style="left:${l}px;width:${w}px;background:color-mix(in srgb, ${e.color} 14%, var(--surface))">
        <span style="left:${mid}px;transform:translateX(-50%)">${esc(name)}</span></div>`;
    }).join('');

    renderEvents();
    renderLives();
    renderMinimap();
  }

  function renderEvents() {
    const laneH = laneEvents.clientHeight;
    const ROW = 34, BASE = 12;
    const maxRows = Math.max(1, Math.floor((laneH - BASE - 34) / ROW));
    const font = '400 12.5px Heebo', yfont = '600 11.5px Heebo';
    const rowsLeft = []; // per row: leftmost occupied x
    let html = '', hidden = 0;
    for (const e of POINTS) {
      const x = X(e.year);
      const w = Math.min(230, 9 + 10 + textW(String(e.year), yfont) + 7 + textW(e.text, font) + 4);
      let row = -1;
      for (let r = 0; r < maxRows; r++) {
        if (rowsLeft[r] === undefined || x + 6 < rowsLeft[r]) { row = r; break; }
      }
      const t = TYPE[e.type];
      if (x < -260 || x > W + 260) { if (row >= 0) rowsLeft[row] = x - w; continue; }
      if (row < 0) {
        hidden++;
        html += `<div class="ev-dot" data-ev="${e.id}" style="left:${x}px;--c:${t.c}"></div>`;
        continue;
      }
      rowsLeft[row] = x - w;
      const bottom = BASE + row * ROW;
      html += `<div class="stem" style="left:${x}px;height:${bottom}px"></div>
        <div class="ev-card${selected === e.id ? ' sel' : ''}" data-ev="${e.id}" style="left:${x - w}px;width:${w}px;bottom:${bottom}px;--c:${t.c}">
          <span class="yr">${e.year}</span><span class="tx">${esc(e.text)}</span></div>`;
    }
    evLayer.innerHTML = html;
  }

  function renderLives() {
    const ROW = 28, TOP = 38;
    const font = '500 12px Heebo';
    const rows = [];
    let html = '';
    for (const p of PEOPLE) {
      const xr = X(p.start);
      const open = p.end == null;
      const xl = open ? xr - Math.max(46, 30 * Math.min(view.ppy, 2)) : X(p.end);
      const bw = Math.max(6, xr - xl);
      const span = lifespan(p);
      const label = p.name;
      const sub = span != null ? `${span}` : (open ? 'נ׳ ' + p.start : '');
      const lw = textW(label, font) + (sub ? textW(sub, '400 11px Heebo') + 8 : 0) + 16;
      const inside = bw >= lw;
      const left = inside ? xr - bw : xr - bw - 6 - lw + 8;
      let row = rows.findIndex(r => xr + 4 < r);
      if (row < 0) { row = rows.length; rows.push(0); }
      rows[row] = left;
      if (xr < -20 || left > W + 20) continue;
      const top = TOP + row * ROW;
      const tt = p.birth ? `שנים ${p.start}–${p.end ?? '?'}` : '';
      // clip to the viewport (+ a little) so the lane never gets horizontal overflow
      const bl = Math.max(-12, xr - bw), br = Math.min(W + 12, xr);
      html += `<div class="life${open ? ' open' : ''}${selected === 'p:' + p.id ? ' sel' : ''}" data-person="${p.id}" style="left:${bl}px;width:${Math.max(6, br - bl)}px;top:${top}px"></div>`;
      // inside: hug the birth (right) end, sliding along so it stays on screen
      const lx = inside ? clamp(Math.min(xr, W) - lw - 4, xr - bw + 4, xr - lw - 4) : left;
      html += `<div class="life-label${inside ? '' : ' out'}" data-person="${p.id}" style="left:${lx}px;width:${lw}px;top:${top}px;justify-content:flex-start;padding-right:${inside ? 6 : 0}px">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
    }
    livesLayer.style.height = (TOP + rows.length * ROW + 14) + 'px';
    livesLayer.innerHTML = html;
  }

  // minimap
  const MM_PAD = 14;
  const mmX = y => { const w = minimap.clientWidth; return w - MM_PAD - (y - DMIN) / (DMAX - DMIN) * (w - 2 * MM_PAD); };
  const mmY = x => { const w = minimap.clientWidth; return DMIN + (w - MM_PAD - x) / (w - 2 * MM_PAD) * (DMAX - DMIN); };
  function renderMinimap() {
    let h = ERAS.map(e => `<div class="mm-band" style="left:${mmX(e.to)}px;width:${mmX(e.from) - mmX(e.to)}px;background:color-mix(in srgb, ${e.color} 18%, transparent)"></div>`).join('');
    h += EVENTS.map(e => `<div class="mm-tick" style="left:${mmX(e.year) - 1}px;background:${TYPE[e.type].c}"></div>`).join('');
    const step = (DMAX - DMIN) > 2000 ? 500 : 250;
    for (let y = 0; y <= DMAX; y += step) h += `<div class="mm-lab" style="left:${mmX(y)}px">${y}</div>`;
    const l = mmX(Math.min(DMAX, Yat(0))), r = mmX(Math.max(DMIN, Yat(W)));
    h += `<div class="mm-window" style="left:${l}px;width:${Math.max(8, r - l)}px"></div>`;
    minimap.innerHTML = h;
  }

  function animateTo(c2, p2, dur = 520) {
    cancelAnimationFrame(anim);
    const c1 = view.c, p1 = view.ppy, t0 = performance.now();
    const l1 = Math.log(p1), l2 = Math.log(p2);
    const step = t => {
      let k = Math.min(1, (t - t0) / dur);
      k = 1 - Math.pow(1 - k, 3);
      view.ppy = Math.exp(l1 + (l2 - l1) * k);
      view.c = c1 + (c2 - c1) * k;
      render();
      if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  function zoomAt(px, f) {
    const y0 = Yat(px);
    view.ppy = clamp(view.ppy * f, fitPpy() * 0.85, maxPpy());
    view.c = y0 + (px - W / 2) / view.ppy;
    render();
  }
  function fitAll(animated = true) {
    const p = fitPpy(), c = (DMIN + DMAX) / 2;
    animated ? animateTo(c, p) : (view.ppy = p, view.c = c, render());
  }
  function focusRange(a, b) {
    const span = Math.max(8, b - a);
    animateTo((a + b) / 2, clamp((W - 140) / span, fitPpy(), maxPpy()));
  }
  function focusYear(y, minPpy = 3) {
    flashYear = y;
    animateTo(y, Math.max(view.ppy, minPpy));
    clearTimeout(focusYear.t);
    focusYear.t = setTimeout(() => { flashYear = null; render(); }, 2300);
  }

  // ----- interaction -----
  const pointers = new Map();
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target === laneLives && e.offsetX > laneLives.clientWidth) return; // scrollbar
    cancelAnimationFrame(anim);
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const hit = e.target.closest('[data-ev],[data-person],[data-era]');
    if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, moved: false, hit };
    else { drag = null; pinchStart(); }
    hideTip();
  });
  let pinch = null;
  function pinchStart() {
    const [a, b] = [...pointers.values()];
    const rect = stage.getBoundingClientRect();
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), ppy: view.ppy, y0: Yat((a.x + b.x) / 2 - rect.left) };
  }
  stage.addEventListener('pointermove', e => {
    const rect = stage.getBoundingClientRect();
    if (pointers.has(e.pointerId)) {
      const prev = pointers.get(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        const mid = (a.x + b.x) / 2 - rect.left;
        view.ppy = clamp(pinch.ppy * d / pinch.d, fitPpy() * 0.85, maxPpy());
        view.c = pinch.y0 + (mid - W / 2) / view.ppy;
        render();
        return;
      }
      if (drag) {
        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
        if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) { drag.moved = true; stage.classList.add('dragging'); }
        if (drag.moved) {
          view.c += dx / view.ppy;
          laneLives.scrollTop -= dy;
          render();
        }
      }
      return;
    }
    // hover crosshair
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (y < 30) { cross.style.display = crossLabel.style.display = 'none'; return; }
    const yr = Math.round(Yat(x));
    if (yr < DMIN || yr > DMAX) { cross.style.display = crossLabel.style.display = 'none'; return; }
    cross.style.display = crossLabel.style.display = 'block';
    cross.style.left = X(yr) + 'px';
    crossLabel.style.left = X(yr) + 'px';
    crossLabel.style.top = (axis.offsetTop + 17) + 'px';
    crossLabel.textContent = `${yr}${yr ? ' · ' + heYear(yr) : ''}`;
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && !drag.moved && e.type === 'pointerup') {
      const h = drag.hit;
      if (h?.dataset.ev) openEvent(h.dataset.ev);
      else if (h?.dataset.person) openPerson(h.dataset.person);
      else if (h?.dataset.era) { const er = ERAS.find(x => x.id === h.dataset.era); focusRange(er.from, er.to); setEraChip(er.id); }
    }
    if (pointers.size === 0) { drag = null; stage.classList.remove('dragging'); }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', () => { cross.style.display = crossLabel.style.display = 'none'; });
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    cancelAnimationFrame(anim);
    const rect = stage.getBoundingClientRect();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) {
      view.c -= (e.shiftKey ? e.deltaY : e.deltaX) / view.ppy;
      render();
    } else {
      const k = e.deltaMode === 1 ? 0.05 : 0.0018;
      zoomAt(e.clientX - rect.left, Math.exp(-e.deltaY * k));
    }
    hideTip();
  }, { passive: false });

  // tooltip
  stage.addEventListener('pointerover', e => {
    if (drag?.moved || pointers.size) return;
    const t = e.target.closest('[data-ev],[data-person],[data-era]');
    if (!t) return hideTip();
    if (t.dataset.era) {
      const er = ERAS.find(x => x.id === t.dataset.era);
      const nEv = EVENTS.filter(x => eraOf(x.year) === er).length;
      const nBorn = PEOPLE.filter(p => p.birth && eraOf(p.birth.year) === er).length;
      tip.innerHTML = `<b>${esc(er.name)}</b>
        <div>${er.from}–${er.to} <span class="tm">· ${heYear(er.from) || '0'} – ${heYear(er.to)}</span></div>
        <div>משך: <b>${yearsTxt(er.to - er.from)}</b></div>
        <div class="tm">${nEv} אירועים${nBorn ? ` · ${nBorn} לידות` : ''} · לחיצה להתמקדות</div>`;
    } else if (t.dataset.ev) {
      const ev = BY_ID.get(t.dataset.ev);
      tip.innerHTML = `<div class="tm">שנת ${ev.year}${ev.year ? ' · ' + heYear(ev.year) : ''} · ${esc(eraOf(ev.year).name)}</div><b>${esc(ev.text)}</b>${ev.refs[0] ? `<div class="tm">${esc(ev.refs[0].slice(0, 80))}</div>` : ''}`;
    } else {
      const p = PERSON_BY_ID.get(t.dataset.person);
      const s = lifespan(p);
      tip.innerHTML = `<b>${esc(p.name)}</b><div class="tm">${p.birth ? 'נולד ' + p.birth.year : ''}${p.death ? ' · נפטר ' + p.death.year : ''}${s != null ? ` · חי ${s} שנה` : ''}</div>`;
    }
    tip.style.display = 'block';
  });
  stage.addEventListener('pointermove', e => {
    if (tip.style.display !== 'block') return;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = e.clientX - tw / 2, y = e.clientY - th - 14;
    if (y < 8 || e.target.closest('[data-era]')) y = e.clientY + 18;
    tip.style.left = clamp(x, 8, innerWidth - tw - 8) + 'px';
    tip.style.top = y + 'px';
  });
  stage.addEventListener('pointerout', e => { if (!e.relatedTarget || !stage.contains(e.relatedTarget) || !e.relatedTarget.closest('[data-ev],[data-person],[data-era]')) hideTip(); });
  function hideTip() { tip.style.display = 'none'; }

  // minimap drag
  let mmDrag = false;
  minimap.addEventListener('pointerdown', e => {
    mmDrag = true; minimap.setPointerCapture(e.pointerId);
    const r = minimap.getBoundingClientRect();
    animateTo(clamp(mmY(e.clientX - r.left), DMIN, DMAX), view.ppy, 260);
  });
  minimap.addEventListener('pointermove', e => {
    if (!mmDrag) return;
    cancelAnimationFrame(anim);
    const r = minimap.getBoundingClientRect();
    view.c = clamp(mmY(e.clientX - r.left), DMIN, DMAX);
    render();
  });
  minimap.addEventListener('pointerup', () => mmDrag = false);
  minimap.addEventListener('pointercancel', () => mmDrag = false);

  // toolbar
  $('#zoomIn').onclick = () => animateTo(view.c, clamp(view.ppy * 1.8, fitPpy(), maxPpy()), 300);
  $('#zoomOut').onclick = () => animateTo(view.c, clamp(view.ppy / 1.8, fitPpy() * .85, maxPpy()), 300);
  $('#zoomFit').onclick = () => { fitAll(); setEraChip('all'); };
  $('#yearJump').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const y = parseInt(e.target.value, 10);
    if (isNaN(y)) return;
    if (y < DMIN || y > DMAX) return toast(`השנה חייבת להיות בין ${DMIN} ל-${DMAX}`, 'err');
    focusYear(y, 4);
    e.target.blur();
  });

  function renderEraNav() {
    const counts = Object.fromEntries(ERAS.map(e => [e.id, 0]));
    EVENTS.forEach(e => counts[eraOf(e.year).id]++);
    $('#erasNav').innerHTML = `<button class="chip active" data-era="all">כל התקופות</button>` + ERAS.map(e =>
      `<button class="chip" data-era="${e.id}" title="${e.from}–${e.to} · ${yearsTxt(e.to - e.from)}"><span class="sw" style="background:${e.color}"></span>${esc(e.name)} <span class="ct num">${counts[e.id]}</span></button>`).join('');
    $('#erasNav').onclick = e => {
      const b = e.target.closest('[data-era]'); if (!b) return;
      setEraChip(b.dataset.era);
      if (b.dataset.era === 'all') return fitAll();
      const er = ERAS.find(x => x.id === b.dataset.era);
      focusRange(er.from, er.to);
    };
    $('#eraSel').innerHTML = '<option value="">כל התקופות</option>' + ERAS.map(e => `<option value="${e.id}">${esc(e.name)} (${e.from}–${e.to})</option>`).join('');
  }
  function setEraChip(id) {
    document.querySelectorAll('#erasNav .chip').forEach(c => c.classList.toggle('active', c.dataset.era === id));
    const c = $(`#erasNav .chip[data-era="${id}"]`);
    c?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }

  // ================= LIST =================
  const F = { q: '', type: 'all', era: '', from: '', to: '', fromText: '', toText: '' };
  let listResults = [];

  function computeFilter() {
    let lo = F.from !== '' ? +F.from : -Infinity, hi = F.to !== '' ? +F.to : Infinity;
    let hint = [];
    if (F.fromText) {
      const m = EVENTS.find(e => e.text.includes(F.fromText));
      if (m) { lo = Math.max(lo, m.year); hint.push(`מ-${m.year} (${m.text})`); } else hint.push('אירוע ההתחלה לא נמצא');
    }
    if (F.toText) {
      const m = [...EVENTS].reverse().find(e => e.text.includes(F.toText));
      if (m) { hi = Math.min(hi, m.year); hint.push(`עד ${m.year} (${m.text})`); } else hint.push('אירוע הסיום לא נמצא');
    }
    $('#rangeHint').textContent = hint.join(' · ');
    const era = F.era ? ERAS.find(e => e.id === F.era) : null;
    const q = F.q.trim();
    return EVENTS.filter(e => {
      if (e.year < lo || e.year > hi) return false;
      if (era && eraOf(e.year) !== era) return false;
      if (F.type !== 'all' && e.type !== F.type) return false;
      if (q && !(e.text.includes(q) || e.refs.some(r => r.includes(q)) || String(e.year) === q)) return false;
      return true;
    });
  }

  function hl(text) {
    const q = F.q.trim();
    if (!q) return esc(text);
    const i = text.indexOf(q);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  function renderList() {
    listResults = computeFilter();
    const n = listResults.length;
    $('#listCount').innerHTML = n
      ? `<b class="num">${n}</b> ${n === 1 ? 'אירוע' : 'אירועים'} · שנים <span class="num">${listResults[0].year}–${listResults[n - 1].year}</span>`
      : '<b>0</b> תוצאות';
    if (!n) {
      $('#listBody').innerHTML = `<div class="empty"><i class="fas fa-magnifying-glass"></i>לא נמצאו אירועים התואמים את החיפוש<br><button class="btn" style="margin-top:14px" onclick="resetFilters()">איפוס מסננים</button></div>`;
      return;
    }
    let html = '', curEra = null, prev = null;
    for (const e of listResults) {
      const era = eraOf(e.year);
      if (era !== curEra) {
        if (curEra) html += '</div></div>';
        const cnt = listResults.filter(x => eraOf(x.year) === era).length;
        html += `<div class="era-group"><div class="era-head"><span class="sw" style="background:${era.color}"></span><h3>${esc(era.name)}</h3><span class="meta">${era.from}–${era.to} · ${cnt} ${cnt === 1 ? 'אירוע' : 'אירועים'}</span></div><div class="rows">`;
        curEra = era; prev = null;
      }
      if (prev && e.year - prev.year >= 40) html += `<div class="gap-note">${yearsTxt(e.year - prev.year)}</div>`;
      const t = TYPE[e.type];
      const meta = [];
      if (e.person) {
        const s = lifespan(e.person);
        if (e.type === 'death' && s != null) meta.push(`<span class="tag"><i class="fas fa-hourglass-end"></i>בגיל ${s}</span>`);
        if (e.type === 'birth' && s != null) meta.push(`<span class="tag"><i class="fas fa-hourglass-start"></i>חי ${s} שנה</span>`);
      }
      e.refs.forEach(r => meta.push(`<span class="tag${r.length > 40 ? ' trunc' : ''}" title="${esc(r)}"><i class="fas fa-book-open"></i>${hl(r)}</span>`));
      html += `<button class="row${selectedRow(e) ? ' sel' : ''}" data-ev="${e.id}">
        <div class="row-year"><b>${e.year}</b><span>${heYear(e.year)}</span></div>
        <div class="row-dot" style="--c:${t.c};--s:${t.s}"><i class="fas ${t.icon}"></i></div>
        <div><div class="row-text">${hl(e.text)}</div>${meta.length ? `<div class="row-meta">${meta.join('')}</div>` : ''}</div>
      </button>`;
      prev = e;
    }
    html += '</div></div>';
    $('#listBody').innerHTML = html;
  }
  const selectedRow = e => selected === e.id;

  $('#listBody').addEventListener('click', e => { const r = e.target.closest('[data-ev]'); if (r) openEvent(r.dataset.ev); });
  let qT;
  $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { F.q = e.target.value; renderList(); }, 120); });
  $('#typeFilter').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    F.type = b.dataset.t;
    document.querySelectorAll('#typeFilter button').forEach(x => x.classList.toggle('active', x === b));
    renderList();
  });
  $('#eraSel').addEventListener('change', e => { F.era = e.target.value; renderList(); });
  [['fromY', 'from'], ['toY', 'to'], ['fromText', 'fromText'], ['toText', 'toText']].forEach(([id, k]) =>
    $('#' + id).addEventListener('input', e => { F[k] = e.target.value.trim(); clearTimeout(qT); qT = setTimeout(renderList, 150); }));
  function resetFilters() {
    Object.assign(F, { q: '', type: 'all', era: '', from: '', to: '', fromText: '', toText: '' });
    ['q', 'fromY', 'toY', 'fromText', 'toText'].forEach(id => $('#' + id).value = '');
    $('#eraSel').value = '';
    document.querySelectorAll('#typeFilter button').forEach(x => x.classList.toggle('active', x.dataset.t === 'all'));
    renderList();
  }
  $('#clearFilters').onclick = resetFilters;
  $('#showOnTl').onclick = () => {
    if (!listResults.length) return;
    setView('timeline');
    requestAnimationFrame(() => focusRange(listResults[0].year, listResults[listResults.length - 1].year));
  };

  // ================= DRAWER =================
  const drawer = $('#drawer'), scrim = $('#scrim');
  let current = null; // {kind:'ev'|'p', id}

  function pillHTML(t, extra = '') { return `<span class="pill" style="--c:${t.c};--s:${t.s}"><i class="fas ${t.icon}"></i>${t.label}${extra}</span>`; }
  function eraPill(y) { const e = eraOf(y); return `<span class="pill" style="--c:var(--ink-2);--s:color-mix(in srgb, ${e.color} 18%, var(--surface))">${esc(e.name)}</span>`; }

  function miniRow(e, rel, cur) {
    return `<button class="mini${cur ? ' cur' : ''}" data-ev="${e.id}"><span class="y">${e.year}</span><span class="d" style="--c:${TYPE[e.type].c}"></span><span class="t">${esc(e.text)}</span><span class="r">${rel}</span></button>`;
  }

  function openEvent(id) {
    const e = BY_ID.get(id); if (!e) return;
    current = { kind: 'ev', id }; selected = id;
    const t = TYPE[e.type];
    $('#dPills').innerHTML = pillHTML(t) + eraPill(e.year);
    const idx = EVENTS.indexOf(e);
    const prevE = EVENTS[idx - 1], nextE = EVENTS[idx + 1];
    const nearby = EVENTS.slice(Math.max(0, idx - 4), idx + 5);
    const people = alive(e.year).filter(p => p !== e.person || e.type !== 'death');
    let h = `<div class="d-title">${esc(e.text)}</div>
      <div class="d-year"><b>שנת ${e.year}</b><span>${heYear(e.year)}</span><span>· לבריאת העולם</span></div>
      <div class="d-stats">
        <div class="d-stat"><div class="k">מהאירוע הקודם</div><div class="v">${prevE ? e.year - prevE.year : '—'}<small>${prevE ? 'שנים' : ''}</small></div></div>
        <div class="d-stat"><div class="k">עד האירוע הבא</div><div class="v">${nextE ? nextE.year - e.year : '—'}<small>${nextE ? 'שנים' : ''}</small></div></div>
        <div class="d-stat"><div class="k">דמויות בחיים</div><div class="v">${people.length}</div></div>
      </div>`;
    if (e.person) {
      const p = e.person, s = lifespan(p);
      h += `<div class="d-sec"><h4>הדמות</h4><button class="person-chip" data-person="${p.id}"><i class="fas fa-user" style="color:var(--life)"></i>${esc(p.name)}<small>${p.start}–${p.end ?? '?'}${s != null ? ` · ${s} שנה` : ''}</small></button></div>`;
    }
    if (e.refs.length) h += `<div class="d-sec"><h4>מקורות והערות <span class="n">${e.refs.length}</span></h4><div class="refs">${e.refs.map(r => `<div class="ref"><i class="fas fa-book-open"></i><div>${esc(r)}</div></div>`).join('')}</div></div>`;
    if (people.length) h += `<div class="d-sec"><h4>בחיים באותה שנה <span class="n">${people.length}</span></h4><div class="people">${people.map(p => `<button class="person-chip" data-person="${p.id}">${esc(p.name)}<small>בן ${e.year - p.birth.year}</small></button>`).join('')}</div></div>`;
    h += `<div class="d-sec"><h4>אירועים סמוכים</h4><div class="mini-list">${nearby.map(x => miniRow(x, x === e ? 'כאן' : (x.year === e.year ? 'אותה שנה' : (x.year < e.year ? '−' : '+') + Math.abs(x.year - e.year)), x === e)).join('')}</div></div>`;
    $('#dBody').innerHTML = h;
    showDrawer();
  }

  function openPerson(id) {
    const p = PERSON_BY_ID.get(id); if (!p) return;
    current = { kind: 'p', id }; selected = 'p:' + id;
    const s = lifespan(p);
    const end = p.end ?? p.start;
    $('#dPills').innerHTML = pillHTML(TYPE.person) + eraPill(p.start);
    const during = EVENTS.filter(e => e.year >= p.start && e.year <= end && e.person !== p);
    const contemporaries = PEOPLE.filter(q => q !== p && q.birth && p.birth && q.start <= end && (q.end ?? q.start) >= p.start)
      .map(q => ({ q, overlap: Math.min(end, q.end ?? q.start) - Math.max(p.start, q.start) }))
      .sort((a, b) => b.overlap - a.overlap);
    const span = Math.max(1, end - p.start);
    let h = `<div class="d-title">${esc(p.name)}</div>
      <div class="d-year"><b>${p.start}${p.end != null ? '–' + p.end : ''}</b><span>${heYear(p.start)}${p.end != null ? ' – ' + heYear(p.end) : ''}</span></div>
      <div class="d-stats">
        <div class="d-stat"><div class="k">לידה</div><div class="v">${p.birth ? p.birth.year : '—'}</div></div>
        <div class="d-stat"><div class="k">פטירה</div><div class="v">${p.death ? p.death.year : '—'}</div></div>
        <div class="d-stat"><div class="k">שנות חיים</div><div class="v">${s ?? '—'}</div></div>
      </div>`;
    if (s) {
      h += `<div class="lifebar"><div class="track"></div>${during.map(e => `<div class="mk" title="${esc(e.year + ' · ' + e.text)}" style="right:${(e.year - p.start) / span * 100}%;--c:${TYPE[e.type].c}"></div>`).join('')}
        <span class="end" style="right:0">לידה</span><span class="end" style="left:0">פטירה</span></div>`;
    }
    const refs = [...(p.birth?.refs || []).map(r => ['לידה', r]), ...(p.death?.refs || []).map(r => ['פטירה', r])];
    if (refs.length) h += `<div class="d-sec"><h4>מקורות</h4><div class="refs">${refs.map(([k, r]) => `<div class="ref"><i class="fas fa-book-open"></i><div><b style="font-weight:600">${k}:</b> ${esc(r)}</div></div>`).join('')}</div></div>`;
    if (during.length && p.birth) h += `<div class="d-sec"><h4>אירועים בימי חייו <span class="n">${during.length}</span></h4><div class="mini-list">${during.map(e => miniRow(e, 'בגיל ' + (e.year - p.birth.year))).join('')}</div></div>`;
    if (contemporaries.length) h += `<div class="d-sec"><h4>בני דורו <span class="n">${contemporaries.length}</span></h4><div class="people">${contemporaries.map(({ q, overlap }) => `<button class="person-chip" data-person="${q.id}">${esc(q.name)}<small>${overlap} שנים משותפות</small></button>`).join('')}</div></div>`;
    $('#dBody').innerHTML = h;
    showDrawer();
  }

  function showDrawer() {
    drawer.classList.add('show'); drawer.setAttribute('aria-hidden', 'false');
    if (innerWidth <= 760) scrim.classList.add('show');
    $('#dBody').scrollTop = 0;
    render(); if ($('#view-list').classList.contains('active')) markListSel();
  }
  function markListSel() { document.querySelectorAll('#listBody .row').forEach(r => r.classList.toggle('sel', r.dataset.ev === selected)); }
  function closeDrawer() {
    drawer.classList.remove('show'); scrim.classList.remove('show'); drawer.setAttribute('aria-hidden', 'true');
    selected = null; current = null; render(); markListSel();
  }
  $('#dClose').onclick = closeDrawer;
  scrim.onclick = closeDrawer;
  $('#dBody').addEventListener('click', e => {
    const a = e.target.closest('[data-ev]'); if (a) return openEvent(a.dataset.ev);
    const b = e.target.closest('[data-person]'); if (b) return openPerson(b.dataset.person);
  });
  function stepDrawer(dir) {
    if (!current) return;
    if (current.kind === 'ev') {
      const i = EVENTS.indexOf(BY_ID.get(current.id)) + dir;
      if (EVENTS[i]) { openEvent(EVENTS[i].id); if ($('#view-timeline').classList.contains('active')) focusYear(EVENTS[i].year, view.ppy); }
    } else {
      const i = PEOPLE.indexOf(PERSON_BY_ID.get(current.id)) + dir;
      if (PEOPLE[i]) openPerson(PEOPLE[i].id);
    }
  }
  $('#dPrev').onclick = () => stepDrawer(-1);
  $('#dNext').onclick = () => stepDrawer(1);
  $('#dLocate').onclick = () => {
    if (!current) return;
    setView('timeline');
    requestAnimationFrame(() => {
      if (current.kind === 'ev') focusYear(BY_ID.get(current.id).year, 4);
      else { const p = PERSON_BY_ID.get(current.id); focusRange(p.start - 20, (p.end ?? p.start) + 20); }
      if (innerWidth <= 760) { drawer.classList.remove('show'); scrim.classList.remove('show'); }
    });
  };

  // ================= ADD MODAL =================
  const modal = $('#modal');
  function openModal() {
    modal.classList.add('show');
    $('#addForm').reset(); updatePreview();
    setTimeout(() => $('#fYear').focus(), 40);
  }
  function closeModal() { modal.classList.remove('show'); }
  $('#addBtn').onclick = openModal;
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-close]')) closeModal(); });
  function updatePreview() {
    const y = parseInt($('#fYear').value, 10);
    if (isNaN(y)) { $('#fPreview').innerHTML = 'הזינו שנה כדי לראות את מיקום האירוע בציר.'; return; }
    const before = [...EVENTS].reverse().find(e => e.year <= y), after = EVENTS.find(e => e.year > y);
    const ppl = alive(y).map(p => `${p.name} (${y - p.birth.year})`);
    $('#fPreview').innerHTML = `<b>${heYear(y) || y}</b> · ${esc(eraOf(y).name)}<br>
      ${before ? `אחרי: ${esc(before.text)} (${before.year})` : ''}${before && after ? ' · ' : ''}${after ? `לפני: ${esc(after.text)} (${after.year})` : ''}
      ${ppl.length ? `<br>בחיים: ${esc(ppl.slice(0, 6).join(', '))}${ppl.length > 6 ? ` ועוד ${ppl.length - 6}` : ''}` : ''}`;
  }
  $('#fYear').addEventListener('input', updatePreview);
  $('#addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const year = parseInt($('#fYear').value, 10), text = $('#fText').value.trim();
    if (isNaN(year) || !text) return toast('יש למלא שנה ותיאור', 'err');
    const references = $('#fRefs').value.split(',').map(s => s.trim()).filter(Boolean);
    const btn = $('#fSave'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> שומר…';
    try {
      const res = await fetch(`${API_BASE}/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
        body: JSON.stringify({ year, text, references }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.message || body.error || 'שגיאה בשמירה');
      closeModal();
      await loadData(); renderAll();
      toast('האירוע נשמר');
      if (body.uuid && BY_ID.has(body.uuid)) {
        setView('timeline');
        requestAnimationFrame(() => { focusYear(year, 4); openEvent(body.uuid); });
      }
    } catch (err) {
      toast(/DUPLI/i.test(err.message) ? 'אירוע זהה כבר קיים' : err.message, 'err');
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> שמירה';
    }
  });

  // ================= VIEW SWITCHING / KEYS =================
  function setView(v) {
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
    history.replaceState(null, '', '#' + v);
    if (v === 'timeline') requestAnimationFrame(render); else { renderList(); }
  }
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setView(b.dataset.view));

  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if (e.key === 'Escape') { if (modal.classList.contains('show')) return closeModal(); if (drawer.classList.contains('show')) return closeDrawer(); }
    if (typing || modal.classList.contains('show')) return;
    if (e.ctrlKey && e.key === '1') { e.preventDefault(); return setView('timeline'); }
    if (e.ctrlKey && e.key === '2') { e.preventDefault(); return setView('list'); }
    if (e.key === '/') { e.preventDefault(); setView('list'); return $('#q').focus(); }
    if (e.key.toLowerCase() === 'n') { e.preventDefault(); return openModal(); }
    if (drawer.classList.contains('show') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); return stepDrawer(e.key === 'ArrowDown' ? 1 : -1); }
    if (!$('#view-timeline').classList.contains('active')) return;
    if (e.key === '+' || e.key === '=') zoomAt(W / 2, 1.4);
    else if (e.key === '-') zoomAt(W / 2, 1 / 1.4);
    else if (e.key === '0') fitAll();
    else if (e.key === 'ArrowLeft') { view.c += 120 / view.ppy; render(); }
    else if (e.key === 'ArrowRight') { view.c -= 120 / view.ppy; render(); }
  });

  function renderAll() { renderStats(); renderEraNav(); render(); renderList(); }

  [laneLives, laneEvents, stage].forEach(el => el.addEventListener('scroll', () => { if (el.scrollLeft) el.scrollLeft = 0; if (el !== laneLives && el.scrollTop) el.scrollTop = 0; }));

  let rT;
  new ResizeObserver(() => { cancelAnimationFrame(rT); rT = requestAnimationFrame(render); }).observe(stage);

  (async function init() {
    try {
      await loadData();
      $('#loading').remove();
      W = stage.clientWidth;
      renderStats(); renderEraNav();
      view.ppy = fitPpy(); view.c = (DMIN + DMAX) / 2;
      setView(location.hash === '#list' ? 'list' : 'timeline');
      renderList();
      document.fonts?.ready.then(render);
    } catch (err) {
      console.error(err);
      $('#loading').innerHTML = '<span><i class="fas fa-triangle-exclamation"></i> שגיאה בטעינת הנתונים</span>';
    }
  })();
</script>
</body>
</html>
